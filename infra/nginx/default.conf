# nginx: serve the SPA and reverse-proxy the API on the same origin.
# Same-origin means the browser sends the Entra bearer token to /api without
# cross-site cookie/CORS complications.

upstream api_upstream {
    server api:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (tighten CSP to your CDNs/Entra endpoints as needed).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API — proxy to the NestJS container.
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 60s;
    }

    # Static assets — long cache (Vite fingerprints filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path resolves to index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
